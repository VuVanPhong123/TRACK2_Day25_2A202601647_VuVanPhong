name: Lab checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run lab verifier
        run: python verify.py
      - name: Run tests
        run: pytest -q
      - name: Refresh generated submission outputs
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/report.md outputs/savings.png outputs/focus_export.csv outputs/writeup.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh generated Lab 25 outputs [skip ci]"
            git push
          fi
